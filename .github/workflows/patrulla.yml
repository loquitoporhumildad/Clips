name: Patrulla de directos

# Cada 2 horas mira quién está en vivo (lista de canales + top de la categoría en Twitch)
# y lanza "Vigilar directo" donde nadie vigila. Solo cuenta de crecimiento (PeakClips, sin campaña).
# Reglas y canales: clips/patrulla.json. A mano: Actions > Patrulla de directos > Run workflow
# (por defecto solo simula; pon simular=false para que lance de verdad).
# Repo público: los minutos de Actions no cuentan contra el límite mensual.

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      simular:
        description: 'true = solo muestra qué lanzaría; false = lanza de verdad'
        default: 'true'

permissions:
  contents: read
  actions: write

concurrency:
  group: patrulla
  cancel-in-progress: false

jobs:
  patrullar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Patrullar
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PATRULLA_SIMULAR: ${{ inputs.simular == 'true' && '1' || '' }}
        run: python3 clips/patrulla.py
