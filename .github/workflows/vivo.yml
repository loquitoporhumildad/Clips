name: Vigilar directo

# Entra a uno o varios directos y corta los momentos apenas pasan (chat + audio).
# Solo para streams con campaña abierta o permiso del streamer.
# Una ejecución dura ~5 h 30 min (límite de 6 h de Actions). Si el directo sigue,
# se vuelve a lanzar sola hasta pasar "hasta_utc". Puedes lanzarla ANTES de que
# empiece el stream: reintenta hasta que salga al aire.
# Repo privado: cuentan contra los 2.000 minutos gratis al mes.

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Links de los directos separados por coma. Opcional por canal: link|campaña'
        required: true
      campana:
        description: 'Campaña o permiso por defecto (ej. "Whop: Westcol GTA VI")'
        required: true
      hasta_utc:
        description: 'Dejar de reencadenar después de esta hora UTC (YYYY-MM-DDTHH:MM). Vacío = una sola ejecución'
        required: false
      minutos:
        description: 'Minutos por ejecución'
        default: '330'
      cantidad_max:
        description: 'Tope de clips por canal y ejecución'
        default: '60'
      cuenta:
        description: 'Cuenta que publica: Clip Vault (con campaña) o PeakClips (crecimiento)'
        default: 'Clip Vault'
      owner:
        description: 'De quién son los clips y los minutos'
        type: choice
        options: [juan, socio]
        default: juan
      registro:
        description: 'Id de la fila en clips_vigilar (lo pone la página; vacío si lo lanzas a mano)'
        required: false

permissions:
  contents: read
  actions: write

jobs:
  preparar:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      entradas: ${{ steps.m.outputs.entradas }}
    steps:
      - id: m
        env:
          URLS: ${{ inputs.urls }}
        run: |
          # GitHub Actions no tiene replace(): armamos la lista JSON aquí.
          echo "entradas=$(printf '%s' "$URLS" | tr -d ' ' | jq -R -c 'split(",") | map(select(length>0))')" >> "$GITHUB_OUTPUT"

  vigilar:
    needs: preparar
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        entrada: ${{ fromJSON(needs.preparar.outputs.entradas) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: clips/requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-montserrat
      - run: pip install -q -r clips/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base
      - name: Vigilar
        id: v
        env:
          LIVE_ENTRADA: ${{ matrix.entrada }}
          CLIP_CAMPANA: ${{ inputs.campana }}
          LIVE_MINUTOS: ${{ inputs.minutos }}
          LIVE_MAX: ${{ inputs.cantidad_max }}
          CLIP_OWNER: ${{ inputs.owner }}
          CLIP_CUENTA: ${{ inputs.cuenta }}
          LIVE_REGISTRO: ${{ inputs.registro }}
          LIVE_HASTA: ${{ inputs.hasta_utc }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python clips/vivo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vivo-${{ strategy.job-index }}
          path: |
            out/clips/**/*.mp4
            out/clips/**/vivo.json
            !out/clips/tmp/**
          retention-days: 7
          if-no-files-found: ignore
      - name: Seguir si el directo sigue y no pasó la hora límite
        if: steps.v.outputs.sigue == 'true' && inputs.hasta_utc != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HASTA: ${{ inputs.hasta_utc }}
          ENTRADA: ${{ matrix.entrada }}
          CAMPANA: ${{ inputs.campana }}
          MINUTOS: ${{ inputs.minutos }}
          MAXIMO: ${{ inputs.cantidad_max }}
          CUENTA: ${{ inputs.cuenta }}
          DUENO: ${{ inputs.owner }}
        run: |
          if [[ "$(date -u +%Y-%m-%dT%H:%M)" < "$HASTA" ]]; then
            gh workflow run vivo.yml -R "$GITHUB_REPOSITORY" \
              -f urls="$ENTRADA" -f campana="$CAMPANA" \
              -f hasta_utc="$HASTA" -f minutos="$MINUTOS" -f cantidad_max="$MAXIMO" \
              -f cuenta="$CUENTA" -f owner="$DUENO" -f registro="${{ inputs.registro }}"
          fi
